name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [ "WEB-BRANCH-TEST-1" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: /home/runner/Qt
          key: qt-6.11.0-wasm-multithread-linux

      - name: Install Qt 6 WebAssembly
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade aqtinstall
          python3 -m aqt install-qt all_os wasm 6.11.0 wasm_multithread --outputdir /home/runner/Qt --autodesktop -m qt5compat qtgraphs qtquick3d qtshadertools

      - name: Set Qt Environment
        run: |
          chmod +x /home/runner/Qt/6.11.0/wasm_multithread/bin/* /home/runner/Qt/6.11.0/gcc_64/bin/* 2>/dev/null || true
          echo "/home/runner/Qt/6.11.0/wasm_multithread/bin" >> $GITHUB_PATH
          echo "/home/runner/Qt/6.11.0/gcc_64/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=/home/runner/Qt/6.11.0/wasm_multithread/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "QT_ROOT_DIR=/home/runner/Qt/6.11.0" >> $GITHUB_ENV

      - name: Configure and Build WASM
        run: |
          if command -v qt-cmake &> /dev/null; then
            qt-cmake -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_NO_EMCC_VERSION_CHECK=ON
          else
            cmake -B build-wasm -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=/home/runner/Qt/6.11.0/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_NO_EMCC_VERSION_CHECK=ON
          fi
          cmake --build build-wasm --config Release

          # Prepare web root and headers for Cloudflare Pages
          cp build-wasm/vesc_tool_7.00.html build-wasm/index.html
          cat << 'EOF' > build-wasm/_headers
/*
  Cross-Origin-Opener-Policy: same-origin
  Cross-Origin-Embedder-Policy: require-corp
EOF

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'webtool'
          directory: 'build-wasm'
