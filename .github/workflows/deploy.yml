name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - "WEB-BRANCH-TEST-1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Install Qt 6 WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          target: 'wasm'
          arch: 'wasm_multithread'
          modules: 'qt5compat qtgraphs qtquick3d qtshadertools'
          extra: '--autodesktop'

      - name: Build project with CMake and Ninja
        run: |
          # Locate Qt's CMake wrapper or toolchain file
          QT_CMAKE=$(which qt-cmake 2>/dev/null || find ${{ runner.temp }} $RUNNER_WORKSPACE -name qt-cmake -perm /111 2>/dev/null | head -n 1)
          if [ -n "$QT_CMAKE" ]; then
            echo "Configuring with qt-cmake: $QT_CMAKE"
            "$QT_CMAKE" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            TOOLCHAIN=$(find ${{ runner.temp }} $RUNNER_WORKSPACE -name qt.toolchain.cmake 2>/dev/null | head -n 1)
            echo "Configuring with toolchain: $TOOLCHAIN"
            emcmake cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DCMAKE_BUILD_TYPE=Release
          fi

          ninja -C build

      - name: Prepare deployment artifacts
        run: |
          mkdir -p dist
          cp -r build/vesc_tool_7.00.* dist/
          cp build/qtloader.js dist/ 2>/dev/null || true
          cp build/qtlogo.svg dist/ 2>/dev/null || true
          cp build/vesc_tool_7.00.html dist/index.html
          cat << 'EOF' > dist/_headers
/*
  Cross-Origin-Opener-Policy: same-origin
  Cross-Origin-Embedder-Policy: require-corp
EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'webtool'
          directory: 'dist'
