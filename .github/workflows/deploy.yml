name: Build and Deploy to Netlify

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: /home/runner/Qt
          key: qt-6.11.0-wasm-multithread-linux-v2

      - name: Install Qt 6 WebAssembly & Host Tools
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade aqtinstall
          python3 -m aqt install-qt all_os wasm 6.11.0 wasm_multithread --outputdir /home/runner/Qt --autodesktop -m qt5compat qtgraphs qtquick3d qtshadertools qtquicktimeline qttasktree qtcharts qtimageformats
          python3 -m aqt install-qt linux desktop 6.11.0 linux_gcc_64 --outputdir /home/runner/Qt -m qtshadertools qtquick3d qtquicktimeline qttasktree

      - name: Set Qt Environment
        run: |
          chmod +x /home/runner/Qt/6.11.0/wasm_multithread/bin/* /home/runner/Qt/6.11.0/gcc_64/bin/* 2>/dev/null || true
          echo "/home/runner/Qt/6.11.0/wasm_multithread/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=/home/runner/Qt/6.11.0/wasm_multithread/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "QT_ROOT_DIR=/home/runner/Qt/6.11.0" >> $GITHUB_ENV
          echo "QT_HOST_PATH=/home/runner/Qt/6.11.0/gcc_64" >> $GITHUB_ENV

      - name: Configure and Build WASM
        run: |
          /home/runner/Qt/6.11.0/wasm_multithread/bin/qt-cmake -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="--profiling-funcs" \
            -DQT_HOST_PATH=/home/runner/Qt/6.11.0/gcc_64 \
            -DQT_NO_EMCC_VERSION_CHECK=ON

          ninja -C build-wasm

          # Prepare web root and headers for Netlify / WebAssembly
          cp build-wasm/vesc_tool_7.00.html build-wasm/index.html

          # Inject on-screen diagnostic HUD, responsive bottom bar, and Web Serial/BLE bridge into index.html
          python3 patch_wasm_html.py build-wasm

          echo "/*" > build-wasm/_headers
          echo "  Cross-Origin-Opener-Policy: same-origin" >> build-wasm/_headers
          echo "  Cross-Origin-Embedder-Policy: require-corp" >> build-wasm/_headers
          echo "/vesc_tool_7.00.wasm" >> build-wasm/_headers
          echo "  Content-Type: application/wasm" >> build-wasm/_headers
          echo "  Cache-Control: public, max-age=31536000, immutable" >> build-wasm/_headers
          echo "/api/proxy" >> build-wasm/_headers
          echo "  Access-Control-Allow-Origin: *" >> build-wasm/_headers
          echo "  Access-Control-Allow-Methods: GET, HEAD, OPTIONS" >> build-wasm/_headers
          echo "  Access-Control-Allow-Headers: *" >> build-wasm/_headers
          echo "  Cross-Origin-Resource-Policy: cross-origin" >> build-wasm/_headers

          echo "/api/proxy /.netlify/functions/proxy 200" > build-wasm/_redirects

          cp -r netlify build-wasm/ 2>/dev/null || true
          cp netlify.toml build-wasm/ 2>/dev/null || true

      - name: Setup Node.js for Netlify Deploy
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Netlify
        run: |
          npx -y netlify-cli deploy --dir=./build-wasm --functions=./netlify/functions --prod --message="Deploy VESC Tool WASM"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
