name: Build and Deploy to Netlify

on:
  push:
    branches: [ "WEB-BRANCH-TEST-1" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: /home/runner/Qt
          key: qt-6.11.0-wasm-multithread-linux-v2

      - name: Install Qt 6 WebAssembly & Host Tools
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade aqtinstall
          python3 -m aqt install-qt all_os wasm 6.11.0 wasm_multithread --outputdir /home/runner/Qt --autodesktop -m qt5compat qtgraphs qtquick3d qtshadertools qtquicktimeline qttasktree qtcharts qtimageformats
          python3 -m aqt install-qt linux desktop 6.11.0 linux_gcc_64 --outputdir /home/runner/Qt -m qtshadertools qtquick3d qtquicktimeline qttasktree

      - name: Set Qt Environment
        run: |
          chmod +x /home/runner/Qt/6.11.0/wasm_multithread/bin/* /home/runner/Qt/6.11.0/gcc_64/bin/* 2>/dev/null || true
          echo "/home/runner/Qt/6.11.0/wasm_multithread/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=/home/runner/Qt/6.11.0/wasm_multithread/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "QT_ROOT_DIR=/home/runner/Qt/6.11.0" >> $GITHUB_ENV
          echo "QT_HOST_PATH=/home/runner/Qt/6.11.0/gcc_64" >> $GITHUB_ENV

      - name: Configure and Build WASM
        run: |
          /home/runner/Qt/6.11.0/wasm_multithread/bin/qt-cmake -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="--profiling-funcs" \
            -DQT_HOST_PATH=/home/runner/Qt/6.11.0/gcc_64 \
            -DQT_NO_EMCC_VERSION_CHECK=ON

          ninja -C build-wasm

          # Prepare web root and headers for Netlify / WebAssembly
          cp build-wasm/vesc_tool_7.00.html build-wasm/index.html

          # Inject on-screen diagnostic HUD and Web Serial bridge into index.html
          python3 - << 'EOF'
          import re

          with open('build-wasm/index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. Lock Viewport to Centered Smartphone Frame
          phone_css = """<style>
          body {
            margin: 0;
            background-color: #151515 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
          }
          #screen {
            width: 100% !important;
            max-width: 460px !important;
            height: 100vh !important;
            position: relative !important;
            overflow: hidden !important;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background-color: #202020;
          }
          #qt-shadow-container {
            width: 100% !important;
            height: 100% !important;
          }
          </style>"""
          content = re.sub(r'<style>.*?</style>', phone_css, content, flags=re.DOTALL)
          print("Patched viewport CSS to 460px centered mobile frame")

          # 2. Pass stdout and stderr hooks into the existing qtLoad call and capture instance
          def patch_qtload(m):
              return m.group(0) + """
                      stdout: function(text) { window.__logToScreen ? window.__logToScreen('[STDOUT] ' + text) : console.log(text); },
                      stderr: function(text) { window.__logToScreen ? window.__logToScreen('[STDERR] ' + text, 'red') : console.error(text); },"""

          content, count = re.subn(r'qtLoad\s*\(\s*\{', patch_qtload, content, count=1)
          print(f"Patched qtLoad hooks in index.html (matches: {count})")

          # Capture the Emscripten module instance from qtLoad
          content = content.replace(
              'const instance = await qtLoad(',
              'const instance = window.Module = await qtLoad('
          )

          # 3. Inject overlay, Web Serial controls, and bridge scripts right before </body>
          hud_html = """
          <!-- VESC Tool WASM Diagnostics & Web Serial Bridge Overlay -->
          <div id="vesc-diagnostics-overlay" style="position:fixed;bottom:0;left:0;right:0;max-height:250px;background:rgba(15,23,42,0.95);backdrop-filter:blur(6px);color:#e2e8f0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;z-index:99999;border-top:2px solid #0284c7;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,0.6);user-select:text;">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:rgba(30,41,59,0.98);border-bottom:1px solid rgba(255,255,255,0.1);font-size:11px;font-weight:600;">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <span style="color:#38bdf8;font-weight:bold;">🛠️ VESC Tool WASM</span>
                <button id="btn-webserial-connect" onclick="window.toggleWebSerial()" style="background:#0284c7;border:1px solid #0369a1;color:#ffffff;padding:2px 8px;font-size:11px;font-weight:600;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">
                  🔌 Connect USB (Web Serial)
                </button>
                <span>Serial: <span id="diag-val-serial-status" style="color:#94a3b8;">Disconnected</span></span>
                <span>Baud: <span id="diag-val-serial-baud" style="color:#a5f3fc;">--</span></span>
                <span>I/O: <span id="diag-val-serial-io" style="color:#cbd5e1;">RX: 0 B / TX: 0 B</span></span>
                <span>COI: <span id="diag-val-coi">checking...</span></span>
                <span>Qt: <span id="diag-val-qt" style="color:#fde047;">Initializing...</span></span>
              </div>
              <div style="display:flex;gap:6px;">
                <button onclick="const l=document.getElementById('vesc-diagnostics-logs');if(l)l.innerHTML='';" style="background:#334155;border:1px solid #475569;color:#f1f5f9;padding:2px 8px;font-size:10px;border-radius:3px;cursor:pointer;">Clear</button>
                <button onclick="const o=document.getElementById('vesc-diagnostics-logs');o.style.display=o.style.display==='none'?'block':'none';" style="background:#334155;border:1px solid #475569;color:#f1f5f9;padding:2px 8px;font-size:10px;border-radius:3px;cursor:pointer;">Toggle Logs</button>
              </div>
            </div>
            <div id="vesc-diagnostics-logs" style="flex:1;overflow-y:auto;max-height:215px;padding:6px 10px;line-height:1.45;word-break:break-all;white-space:pre-wrap;"></div>
          </div>
          <script>
          (function() {
            const logContainer = document.getElementById('vesc-diagnostics-logs');

            function isFilteredMessage(text) {
              if (typeof text !== 'string') return false;
              return text.includes('Failed to link shader program') ||
                     text.includes('Failed to build graphics pipeline state') ||
                     text.includes('res//primitives/Cube.mesh');
            }

            function bytesToHex(arr) {
              if (!arr || !arr.length) return '';
              const hex = [];
              for (let i = 0; i < arr.length; i++) {
                hex.push(arr[i].toString(16).padStart(2, '0'));
              }
              return hex.join(' ');
            }

            window.__logToScreen = function(text, color) {
              if (!logContainer || isFilteredMessage(text)) return;
              const item = document.createElement('div');
              item.style.padding = '1px 0';
              item.style.borderBottom = '1px solid rgba(255,255,255,0.04)';
              if (color) {
                item.style.color = color;
              } else if (typeof text === 'string' && (text.includes('[STDERR]') || text.includes('[ERROR]'))) {
                item.style.color = '#f87171';
              } else if (typeof text === 'string' && text.includes('[WARN]')) {
                item.style.color = '#facc15';
              } else {
                item.style.color = '#cbd5e1';
              }
              const ts = new Date().toTimeString().split(' ')[0] + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
              item.textContent = '[' + ts + '] ' + text;
              logContainer.appendChild(item);
              logContainer.scrollTop = logContainer.scrollHeight;
            };

            // 1. Live status monitors
            function getQtStatus() {
              const el = document.getElementById('qtstatus') || document.querySelector('.qtstatus');
              if (el && el.innerText && el.innerText.trim().length > 0) {
                return el.innerText.trim();
              }
              const spinner = document.getElementById('qtspinner');
              if (spinner && spinner.style.display !== 'none') {
                return 'Loading / Compiling...';
              }
              return 'Running / Ready';
            }

            function updateHud() {
              const coiEl = document.getElementById('diag-val-coi');
              if (coiEl) {
                coiEl.innerHTML = window.crossOriginIsolated
                  ? '<span style="color:#4ade80;font-weight:bold;">true (Isolated)</span>'
                  : '<span style="color:#f87171;font-weight:bold;">false (NOT Isolated - SAB Disabled!)</span>';
              }
              const qtEl = document.getElementById('diag-val-qt');
              if (qtEl) {
                qtEl.textContent = getQtStatus();
              }
            }
            updateHud();
            setInterval(updateHud, 500);

            // 2. Global log redirection
            const origLog = console.log;
            const origWarn = console.warn;
            const origError = console.error;

            console.log = function(...args) {
              const joined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
              if (!isFilteredMessage(joined)) {
                try {
                  window.__logToScreen(joined);
                } catch (_) {}
              }
              origLog.apply(console, args);
            };

            console.warn = function(...args) {
              const joined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
              if (!isFilteredMessage(joined)) {
                try {
                  window.__logToScreen('[WARN] ' + joined, '#facc15');
                } catch (_) {}
              }
              origWarn.apply(console, args);
            };

            console.error = function(...args) {
              const joined = args.map(a => (a instanceof Error ? (a.stack || a.message) : (typeof a === 'object' ? JSON.stringify(a) : String(a)))).join(' ');
              if (!isFilteredMessage(joined)) {
                try {
                  window.__logToScreen('[ERROR] ' + joined, '#f87171');
                } catch (_) {}
              }
              origError.apply(console, args);
            };

            window.onerror = function(msg, url, line, col, error) {
              const errText = error ? (error.stack || error.message) : (msg + ' (' + url + ':' + line + ':' + col + ')');
              if (!isFilteredMessage(errText)) {
                window.__logToScreen('[UNCAUGHT ERROR] ' + errText, '#ef4444');
              }
              return false;
            };

            window.onunhandledrejection = function(event) {
              const reason = event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'Unknown Promise Rejection';
              if (!isFilteredMessage(String(reason))) {
                window.__logToScreen('[UNHANDLED REJECTION] ' + reason, '#ef4444');
              }
            };

            // Module hooks
            window.Module = window.Module || {};
            const origPrint = window.Module.print || console.log;
            const origPrintErr = window.Module.printErr || console.error;
            window.Module.print = function(text) {
              if (!isFilteredMessage(text)) {
                window.__logToScreen('[STDOUT] ' + text);
              }
              origPrint(text);
            };
            window.Module.printErr = function(text) {
              if (!isFilteredMessage(text)) {
                window.__logToScreen('[STDERR] ' + text, 'red');
              }
              origPrintErr(text);
            };

            // 3. Web Serial API Integration
            let serialPort = null;
            let serialReader = null;
            let serialWriter = null;
            let isSerialConnected = false;
            let bytesRx = 0;
            let bytesTx = 0;
            let txBytes = 0;

            function formatBytes(bytes) {
              if (bytes < 1024) return bytes + ' B';
              if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
              return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            function updateSerialHud() {
              const btn = document.getElementById('btn-webserial-connect');
              const statusEl = document.getElementById('diag-val-serial-status');
              const baudEl = document.getElementById('diag-val-serial-baud');
              const ioEl = document.getElementById('diag-val-serial-io');

              if (statusEl) {
                statusEl.innerHTML = isSerialConnected
                  ? '<span style="color:#4ade80;font-weight:bold;">Connected</span>'
                  : '<span style="color:#94a3b8;">Disconnected</span>';
              }
              if (baudEl) {
                baudEl.textContent = isSerialConnected ? '115200' : '--';
              }
              if (ioEl) {
                ioEl.textContent = 'RX: ' + formatBytes(bytesRx) + ' / TX: ' + formatBytes(bytesTx || txBytes);
              }
              if (btn) {
                if (isSerialConnected) {
                  btn.textContent = '🔌 Disconnect USB';
                  btn.style.background = '#dc2626';
                  btn.style.borderColor = '#b91c1c';
                } else {
                  btn.textContent = '🔌 Connect USB (Web Serial)';
                  btn.style.background = '#0284c7';
                  btn.style.borderColor = '#0369a1';
                }
              }
            }

            function updateHudCounters() {
              updateSerialHud();
            }
            window.updateHudCounters = updateHudCounters;

            window.toggleWebSerial = async function() {
              if (isSerialConnected) {
                await disconnectWebSerial();
              } else {
                await connectWebSerial();
              }
            };

            async function connectWebSerial() {
              if (!('serial' in navigator)) {
                window.__logToScreen('[SERIAL ERROR] Web Serial API is not supported in this browser. Please use Chrome, Edge, or Opera.', '#f87171');
                alert('Web Serial API is not supported in this browser.\\nPlease use Google Chrome, Microsoft Edge, or a Chromium-based browser.');
                return;
              }

              try {
                window.__logToScreen('[SERIAL] Requesting USB serial device...');
                serialPort = await navigator.serial.requestPort({ filters: [] });
                window.__logToScreen('[SERIAL] Opening port at 115200 baud (ESP32 VESC Express standard)...');
                await serialPort.open({ baudRate: 115200 });

                isSerialConnected = true;
                if (serialPort.writable) {
                  serialWriter = serialPort.writable.getWriter();
                }

                updateSerialHud();
                window.__logToScreen('[SERIAL] Connected successfully at 115200 baud.', '#4ade80');

                // Notify WASM module of connection
                notifyWasmConnection(1);

                // Start reading loop
                readSerialLoop();
              } catch (err) {
                window.__logToScreen('[SERIAL ERROR] Connection failed: ' + (err.message || err), '#f87171');
                await disconnectWebSerial();
              }
            }

            async function readSerialLoop() {
              while (serialPort && serialPort.readable && isSerialConnected) {
                try {
                  serialReader = serialPort.readable.getReader();
                  while (isSerialConnected) {
                    const { value, done } = await serialReader.read();
                    if (done) break;
                    if (value && value.length > 0) {
                      bytesRx += value.length;
                      updateSerialHud();

                      const hexStr = bytesToHex(value);
                      window.__logToScreen(`[SERIAL RX] (${value.length} bytes): ${hexStr}`, '#a5f3fc');

                      // Feed raw bytes into wasm_serial_rx via EM_JS bridge
                      if (window.__wasm_serial_feed_rx) {
                        window.__wasm_serial_feed_rx(value);
                      } else if (window.Module && typeof window.Module._wasm_serial_rx === 'function') {
                        const ptr = window.Module._malloc(value.length);
                        if (ptr % 8 !== 0) {
                          console.error('[SERIAL ERROR] Unaligned pointer returned by Module._malloc:', ptr, 'len:', value.length);
                          window.__logToScreen(`[SERIAL ERROR] Unaligned pointer returned by Module._malloc: ${ptr} (alignment: ${ptr % 8})`, '#f87171');
                        }
                        window.Module.HEAPU8.set(value, ptr);
                        window.Module._wasm_serial_rx(ptr, value.length);
                        window.Module._free(ptr);
                      }
                    }
                  }
                } catch (err) {
                  if (isSerialConnected) {
                    window.__logToScreen('[SERIAL RX ERROR] ' + (err.message || err), '#f87171');
                  }
                  break;
                } finally {
                  if (serialReader) {
                    try { serialReader.releaseLock(); } catch (_) {}
                    serialReader = null;
                  }
                }
              }

              if (isSerialConnected) {
                disconnectWebSerial();
              }
            }

            async function disconnectWebSerial() {
              isSerialConnected = false;
              window.__logToScreen('[SERIAL] Disconnecting serial port...');

              try {
                if (serialReader) {
                  await serialReader.cancel();
                  serialReader.releaseLock();
                  serialReader = null;
                }
              } catch (_) {}

              try {
                if (serialWriter) {
                  serialWriter.releaseLock();
                  serialWriter = null;
                }
              } catch (_) {}

              try {
                if (serialPort) {
                  await serialPort.close();
                  serialPort = null;
                }
              } catch (_) {}

              notifyWasmConnection(0);
              updateSerialHud();
              window.__logToScreen('[SERIAL] Disconnected.');
            }

            function notifyWasmConnection(connected) {
              if (typeof window.__wasm_serial_set_connected_js === 'function') {
                window.__wasm_serial_set_connected_js(connected ? true : false);
              } else if (window.Module && typeof window.Module._wasm_serial_set_connected === 'function') {
                window.Module._wasm_serial_set_connected(connected ? 1 : 0);
              }
            }

            // Expose outgoing serial TX hook for C++ wasm_serial_tx
            window.wasm_serial_tx = async function(uint8Array) {
              if (serialWriter) {
                try {
                  // Ensure standard Uint8Array buffer (protects against SharedArrayBuffer WebIDL errors)
                  const data = (uint8Array && uint8Array.buffer && uint8Array.buffer instanceof SharedArrayBuffer)
                    ? new Uint8Array(uint8Array)
                    : (uint8Array instanceof Uint8Array ? uint8Array : new Uint8Array(uint8Array));

                  const hexStr = bytesToHex(data);
                  window.__logToScreen(`[SERIAL TX] (${data.length} bytes): ${hexStr}`, '#86efac');

                  await serialWriter.write(data);
                  bytesTx += data.length;
                  txBytes = bytesTx;
                  updateHudCounters();
                } catch (err) {
                  console.error('[SERIAL TX ERROR]', err);
                  window.__logToScreen('[SERIAL TX ERROR] ' + (err.message || err), '#f87171');
                }
              }
            };

            // Listen for device plug/unplug events
            if ('serial' in navigator) {
              navigator.serial.addEventListener('disconnect', (event) => {
                if (serialPort && event.target === serialPort) {
                  window.__logToScreen('[SERIAL] Device unplugged.', '#facc15');
                  disconnectWebSerial();
                }
              });
            }

            window.__logToScreen('Diagnostics & Web Serial overlay initialized.');
          })();
          </script>
          """

          if '</body>' in content:
              content = content.replace('</body>', hud_html + '\n</body>')
              print("Injected diagnostics & Web Serial HUD before </body>")
          elif '</BODY>' in content:
              content = content.replace('</BODY>', hud_html + '\n</BODY>')
              print("Injected diagnostics & Web Serial HUD before </BODY>")
          else:
              content += hud_html
              print("Appended diagnostics & Web Serial HUD to HTML")

          with open('build-wasm/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print("Finished patching build-wasm/index.html")
          EOF


          echo "/*" > build-wasm/_headers
          echo "  Cross-Origin-Opener-Policy: same-origin" >> build-wasm/_headers
          echo "  Cross-Origin-Embedder-Policy: require-corp" >> build-wasm/_headers
          echo "/vesc_tool_7.00.wasm" >> build-wasm/_headers
          echo "  Content-Type: application/wasm" >> build-wasm/_headers
          echo "  Cache-Control: public, max-age=31536000, immutable" >> build-wasm/_headers

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './build-wasm'
          production-branch: WEB-BRANCH-TEST-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy VESC Tool WASM"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
